name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/planner-desktop/package-lock.json

      - name: Install desktop dependencies without lifecycle scripts
        working-directory: apps/planner-desktop
        run: npm ci --ignore-scripts

      - name: Run desktop offline tests
        working-directory: apps/planner-desktop
        run: npm test

      - name: Check desktop JavaScript syntax
        working-directory: apps/planner-desktop
        run: npm run check

      - name: Check jewel compiler script syntax
        working-directory: tools/jewel-compiler
        run: |
          node --check download_poe2_jewel_sources.mjs
          node --check build-jewel-db.mjs
          node --check verify-fixture.mjs

      - name: Verify jewel compiler fixture
        working-directory: tools/jewel-compiler
        run: node verify-fixture.mjs

      - name: Confirm checks left tracked files unchanged
        run: git diff --exit-code
